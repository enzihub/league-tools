<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  body { width: 1200px; height: 630px; background: #050a12; }
  .card { width: 1200px; height: 630px; border-radius: 0; border: 0; }
  .copy { position: absolute; left: 70px; top: 92px; width: 470px; }
  .display { font-size: 76px; margin-top: 18px; }
  .lede { margin-top: 22px; font-size: 23px; line-height: 1.45; color: #d9d2c0; }
  .eyebrow { font-size: 16px; }
  .pills { margin-top: 30px; display: flex; gap: 10px; }
  .pill { font-size: 16px; padding: 9px 16px; }
  .s1 { position: absolute; width: 560px; left: 590px; top: 70px; transform: rotate(-2deg); }
  .s2 { position: absolute; width: 380px; left: 790px; top: 300px; transform: rotate(2.5deg); }
  .url { position: absolute; left: 70px; bottom: 56px; font-size: 16px; color: var(--muted); }
</style></head>
<body><div class="card">
  <div class="copy">
    <div class="eyebrow">Enzi Studio · Open source</div>
    <div class="display">League<br>Tools</div>
    <p class="lede">A champion explorer and A* pathfinding on Summoner’s Rift.</p>
    <div class="pills"><span class="pill"><span class="dot"></span>Champion Mastery</span><span class="pill"><span class="dot" style="background:#c8aa6e"></span>Wayfinder</span></div>
  </div>
  <img class="shot s1" src="../screenshots/champion-profile.png">
  <img class="shot s2" src="../screenshots/wayfinder-route.png">
  <div class="url">github.com/enzihub/league-tools</div>
</div></body></html>
