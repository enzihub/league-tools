<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  body { width: 1000px; height: 700px; }
  .card { width: 1000px; height: 700px; padding: 36px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 26px 26px; }
  figure { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  figure img { width: 100%; height: auto; }
  figcaption { font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
  figcaption b { font-family: Cinzel, serif; color: var(--gold); font-size: 15px; letter-spacing: .06em; font-weight: 600; }
</style></head>
<body><div class="card">
  <figure><img class="shot" src="../screenshots/champion-grid.png"><figcaption><b>Browse</b>173 champions, live from Data Dragon</figcaption></figure>
  <figure><img class="shot" src="../screenshots/champion-profile.png"><figcaption><b>Profile</b>Lore, ratings, abilities and base stats</figcaption></figure>
  <figure><img class="shot" src="../screenshots/wayfinder-route.png"><figcaption><b>Route</b>A* path through five waypoints</figcaption></figure>
  <figure><img class="shot" src="../screenshots/wayfinder-grid.png"><figcaption><b>Grid</b>The walls the pathfinder avoids</figcaption></figure>
</div></body></html>
