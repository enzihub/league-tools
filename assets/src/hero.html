<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="art.css">
<style>
  body { width: 1000px; height: 440px; }
  .card { width: 1000px; height: 440px; }
  .copy { position: absolute; left: 52px; top: 58px; width: 390px; }
  .display { font-size: 58px; margin-top: 14px; }
  .lede { margin-top: 18px; font-size: 18px; line-height: 1.5; color: #d9d2c0; }
  .pills { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px; }
  .s1 { position: absolute; width: 470px; left: 470px; top: 46px; transform: rotate(-2deg); }
  .s2 { position: absolute; width: 330px; left: 640px; top: 210px; transform: rotate(2.5deg); }
  .rule { position: absolute; left: 52px; bottom: 40px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
</style></head>
<body><div class="card">
  <div class="copy">
    <div class="eyebrow">Enzi Studio · Fan tools</div>
    <div class="display">League<br>Tools</div>
    <p class="lede">Browse every champion, then plot the fastest route across Summoner’s Rift with A* pathfinding.</p>
    <div class="pills"><span class="pill"><span class="dot"></span>Champion Mastery</span><span class="pill"><span class="dot" style="background:#c8aa6e"></span>Wayfinder</span></div>
  </div>
  <img class="shot s1" src="../screenshots/champion-grid.png">
  <img class="shot s2" src="../screenshots/wayfinder-route.png">
  <div class="rule">Live data from Riot Data Dragon · Not endorsed by Riot Games</div>
</div></body></html>
